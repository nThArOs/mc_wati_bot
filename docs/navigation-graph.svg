<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="820" fill="#ffffff"/>

  <!-- ============ EDGES (normal) ============ -->
  <g stroke="#c9c9c9" stroke-width="2" fill="none">
    <line x1="140" y1="90"  x2="330" y2="120"/>   <!-- Palais - Theatre -->
    <line x1="330" y1="120" x2="470" y2="205"/>   <!-- Theatre - Horloge -->
    <line x1="470" y1="205" x2="640" y2="185"/>   <!-- Horloge - Intersection 1 -->
    <line x1="640" y1="185" x2="640" y2="90"/>    <!-- Intersection 1 - River -->
    <line x1="640" y1="185" x2="800" y2="215"/>   <!-- Intersection 1 - Church -->
    <line x1="800" y1="215" x2="770" y2="330"/>   <!-- Church - Intersection 2 -->
    <line x1="770" y1="330" x2="610" y2="400"/>   <!-- Intersection 2 - Cathedral -->
    <line x1="470" y1="205" x2="460" y2="400"/>   <!-- Horloge - George orwell -->

    <line x1="460" y1="400" x2="270" y2="440"/>   <!-- George orwell - Place droite -->
    <line x1="460" y1="400" x2="290" y2="580"/>   <!-- George orwell - Place gauche -->
    <line x1="460" y1="400" x2="320" y2="530"/>   <!-- George orwell - Parc -->
    <line x1="270" y1="440" x2="140" y2="510"/>   <!-- Place droite - Place haute -->
    <line x1="270" y1="440" x2="320" y2="530"/>   <!-- Place droite - Parc -->
    <line x1="140" y1="510" x2="320" y2="530"/>   <!-- Place haute - Parc -->
    <line x1="140" y1="510" x2="290" y2="580"/>   <!-- Place haute - Place gauche -->
    <line x1="290" y1="580" x2="320" y2="530"/>   <!-- Place gauche - Parc -->

    <line x1="480" y1="560" x2="690" y2="590"/>   <!-- Arc de triomphe - Salle des coffres -->
    <line x1="690" y1="590" x2="460" y2="700"/>   <!-- Salle des coffres - Usine a fer -->
  </g>

  <!-- ============ EDGES (route de l'arc, highlighted) ============ -->
  <g stroke="#e0692e" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="330" y1="120" x2="350" y2="290"/>   <!-- Theatre - Palace -->
    <line x1="350" y1="290" x2="460" y2="400"/>   <!-- Palace - George orwell -->
    <line x1="460" y1="400" x2="480" y2="560"/>   <!-- George orwell - Arc de triomphe -->
    <line x1="480" y1="560" x2="460" y2="700"/>   <!-- Arc de triomphe - Usine a fer -->
  </g>

  <!-- ============ NODES ============ -->
  <!-- helper style: fill/stroke set per district -->

  <!-- Theatre district (salmon) -->
  <g font-size="18" text-anchor="middle">
    <g>
      <rect x="70" y="65" width="140" height="50" rx="12" fill="#fbe6da" stroke="#a5521f" stroke-width="2"/>
      <text x="140" y="97" fill="#7a3d15">Palais</text>
    </g>
    <g>
      <rect x="255" y="95" width="150" height="50" rx="12" fill="#fbe6da" stroke="#a5521f" stroke-width="2"/>
      <text x="330" y="127" fill="#7a3d15">Theatre</text>
    </g>
    <g>
      <rect x="270" y="265" width="150" height="50" rx="12" fill="#fbe6da" stroke="#a5521f" stroke-width="2"/>
      <text x="345" y="297" fill="#7a3d15">Palace</text>
    </g>
  </g>

  <!-- Pierre bourdieu district (pink) -->
  <g font-size="18" text-anchor="middle">
    <g>
      <rect x="565" y="65" width="150" height="50" rx="12" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
      <text x="640" y="97" fill="#6e1f40">River</text>
    </g>
    <g>
      <rect x="390" y="180" width="160" height="50" rx="12" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
      <text x="470" y="212" fill="#6e1f40">Horloge</text>
    </g>
    <g>
      <rect x="540" y="160" width="200" height="50" rx="12" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
      <text x="640" y="192" fill="#6e1f40">Intersection 1</text>
    </g>
    <g>
      <rect x="720" y="190" width="160" height="50" rx="12" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
      <text x="800" y="222" fill="#6e1f40">Church</text>
    </g>
    <g>
      <rect x="670" y="305" width="200" height="50" rx="12" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
      <text x="770" y="337" fill="#6e1f40">Intersection 2</text>
    </g>
  </g>

  <!-- Cathedrale (gold, standalone) -->
  <g font-size="18" text-anchor="middle">
    <rect x="530" y="375" width="160" height="50" rx="12" fill="#faf1d6" stroke="#a9860f" stroke-width="2"/>
    <text x="610" y="407" fill="#6e5407">Cathedral</text>
  </g>

  <!-- George orwell district (teal) -->
  <g font-size="18" text-anchor="middle">
    <g>
      <rect x="380" y="375" width="160" height="50" rx="12" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
      <text x="460" y="407" fill="#0a4a34">George orwell</text>
    </g>
    <g>
      <rect x="185" y="415" width="170" height="50" rx="12" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
      <text x="270" y="447" fill="#0a4a34">Place droite</text>
    </g>
    <g>
      <rect x="45" y="485" width="170" height="50" rx="12" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
      <text x="130" y="517" fill="#0a4a34">Place haute</text>
    </g>
    <g>
      <rect x="255" y="505" width="130" height="50" rx="12" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
      <text x="320" y="537" fill="#0a4a34">Parc</text>
    </g>
    <g>
      <rect x="205" y="555" width="170" height="50" rx="12" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
      <text x="290" y="587" fill="#0a4a34">Place gauche</text>
    </g>
  </g>

  <!-- Haute ville district (purple) -->
  <g font-size="18" text-anchor="middle">
    <g>
      <rect x="400" y="535" width="170" height="50" rx="12" fill="#e7e4fb" stroke="#4d3ea8" stroke-width="2"/>
      <text x="485" y="567" fill="#2e2270">Arc de triomphe</text>
    </g>
    <g>
      <rect x="600" y="565" width="180" height="50" rx="12" fill="#e7e4fb" stroke="#4d3ea8" stroke-width="2"/>
      <text x="690" y="597" fill="#2e2270">Salle des coffres</text>
    </g>
    <g>
      <rect x="375" y="675" width="170" height="50" rx="12" fill="#e7e4fb" stroke="#4d3ea8" stroke-width="2"/>
      <text x="460" y="707" fill="#2e2270">Usine a fer</text>
    </g>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-size="17">
    <rect x="30" y="760" width="26" height="20" rx="5" fill="#e7e4fb" stroke="#4d3ea8" stroke-width="2"/>
    <text x="65" y="776" fill="#333">Haute ville</text>

    <rect x="200" y="760" width="26" height="20" rx="5" fill="#dcf3ea" stroke="#0f7a56" stroke-width="2"/>
    <text x="235" y="776" fill="#333">George orwell</text>

    <rect x="390" y="760" width="26" height="20" rx="5" fill="#fbe6da" stroke="#a5521f" stroke-width="2"/>
    <text x="425" y="776" fill="#333">Theatre</text>

    <rect x="520" y="760" width="26" height="20" rx="5" fill="#fbe3ec" stroke="#9c2f5c" stroke-width="2"/>
    <text x="555" y="776" fill="#333">Pierre bourdieu</text>

    <rect x="720" y="760" width="26" height="20" rx="5" fill="#faf1d6" stroke="#a9860f" stroke-width="2"/>
    <text x="755" y="776" fill="#333">Cathedrale</text>

    <line x1="30" y1="800" x2="80" y2="800" stroke="#e0692e" stroke-width="6" stroke-linecap="round"/>
    <text x="90" y="806" fill="#333">Route de l'arc (theatre → palace → george orwell → arc de triomphe → usine a fer)</text>
  </g>
</svg>
